<!-- =========================================================
     FLOATING OCEAN MUSIC PLAYER (BOTTOM RIGHT WIDGET)
========================================================= -->
<style>
    /* Floating Mini CD Button Widget */
    .music-widget-btn {
        position: fixed;
        bottom: 25px;
        right: 25px;
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: rgba(10, 25, 47, 0.85);
        border: 2px solid var(--cyan-day);
        box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
        backdrop-filter: blur(10px);
        z-index: 99999;
        cursor: pointer !important;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .music-widget-btn:hover {
        transform: scale(1.1);
    }

    /* Mini CD Disc inside Floating Button */
    .mini-cd-disc {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: repeating-radial-gradient(
            circle at center,
            #1e293b 0px,
            #0f172a 4px,
            #334155 8px,
            #0f172a 12px
        );
        border: 2px solid rgba(255, 255, 255, 0.3);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: spinCD 8s linear infinite;
        animation-play-state: paused;
    }

    .mini-cd-disc.playing {
        animation-play-state: running;
    }

    .mini-cd-center {
        width: 14px;
        height: 14px;
        background: #00f2fe;
        border-radius: 50%;
        border: 3px solid #0f172a;
        box-shadow: 0 0 8px #00f2fe;
    }

    /* Music Player Modal Window */
    .music-player-modal {
        position: fixed;
        bottom: 100px;
        right: 25px;
        width: 320px;
        background: rgba(8, 20, 45, 0.92);
        border: 1px solid rgba(0, 242, 254, 0.4);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 254, 0.2);
        backdrop-filter: blur(20px);
        z-index: 99998;
        display: none;
        flex-direction: column;
        gap: 15px;
        animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .music-player-modal.active {
        display: flex;
    }

    @keyframes popUp {
        0% { opacity: 0; transform: translateY(20px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Player Header */
    .player-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #fff;
    }

    .player-header h4 {
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--cyan-day);
    }

    .close-player-btn {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        font-size: 16px;
        cursor: pointer !important;
        transition: 0.2s;
    }

    .close-player-btn:hover {
        color: #ff4757;
    }

    /* Display Area (Video or CD Spin View) */
    .player-display-container {
        width: 100%;
        height: 180px;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        background: #020617;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* 1. Video Player View Mode */
    .player-video-view {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* 2. CD Spinning Disc View Mode */
    .player-cd-view {
        display: none;
        position: relative;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at center, #334155 0%, #0f172a 70%);
        border: 4px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        animation: spinCD 6s linear infinite;
        animation-play-state: paused;
    }

    .player-cd-view.playing {
        animation-play-state: running;
    }

    .player-cd-view::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 35px;
        height: 35px;
        background: #00f2fe;
        border-radius: 50%;
        border: 4px solid #020617;
    }

    @keyframes spinCD {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Song Info */
    .song-info {
        text-align: center;
        color: #fff;
    }

    .song-title {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .song-artist {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
    }

    /* View Switcher Toggle & Controls */
    .player-controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .view-toggle-btns {
        display: flex;
        justify-content: center;
        gap: 8px;
    }

    .mode-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.75rem;
        cursor: pointer !important;
        transition: 0.3s;
    }

    .mode-btn.active {
        background: var(--cyan-day);
        color: #020617;
        font-weight: 600;
    }

    .action-btns {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }

    .control-btn {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 18px;
        cursor: pointer !important;
        transition: 0.2s;
    }

    .control-btn.play-btn {
        width: 42px;
        height: 42px;
        background: linear-gradient(135deg, var(--cyan-day), #0088ff);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        box-shadow: 0 4px 12px rgba(0, 242, 254, 0.4);
    }

    .control-btn:hover {
        transform: scale(1.1);
    }
</style>

<!-- Floating Mini CD Button -->
<div class="music-widget-btn" id="musicWidgetBtn" title="เปิด/ปิด เครื่องเล่นเพลง">
    <div class="mini-cd-disc" id="miniCD">
        <div class="mini-cd-center"></div>
    </div>
</div>

<!-- Music Player Popup Modal Window -->
<div class="music-player-modal" id="musicModal">
    <div class="player-header">
        <h4><i class="fa-solid fa-compact-disc"></i> Ocean Music Player</h4>
        <button class="close-player-btn" id="closePlayerBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Display Area -->
    <div class="player-display-container">
        <!-- 1. Video Player Mode -->
        <video class="player-video-view" id="playerVideo" loop playsinline muted>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-underwater-view-of-ocean-waves-40118-large.mp4" type="video/mp4">
        </video>

        <!-- 2. CD Spinning Disc Mode -->
        <div class="player-cd-view" id="playerCDView"></div>
    </div>

    <!-- Song Info -->
    <div class="song-info">
        <div class="song-title">Something In The Water</div>
        <div class="song-artist">Ocean Ambient Track</div>
    </div>

    <!-- Audio Element (Audio Track) -->
    <audio id="mainAudio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Controls & Mode Switcher -->
    <div class="player-controls">
        <div class="view-toggle-btns">
            <button class="mode-btn active" id="videoModeBtn"><i class="fa-solid fa-video"></i> วิดีโอ</button>
            <button class="mode-btn" id="cdModeBtn"><i class="fa-solid fa-compact-disc"></i> แผ่นซีดีหมุน</button>
        </div>

        <div class="action-btns">
            <button class="control-btn" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
            <button class="control-btn play-btn" id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
            <button class="control-btn" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>
</div>

<script>
    // Music Player Logic Controls
    const musicWidgetBtn = document.getElementById('musicWidgetBtn');
    const musicModal = document.getElementById('musicModal');
    const closePlayerBtn = document.getElementById('closePlayerBtn');

    const mainAudio = document.getElementById('mainAudio');
    const playerVideo = document.getElementById('playerVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const miniCD = document.getElementById('miniCD');
    const playerCDView = document.getElementById('playerCDView');

    const videoModeBtn = document.getElementById('videoModeBtn');
    const cdModeBtn = document.getElementById('cdModeBtn');

    let isPlaying = false;

    // Toggle Music Player Modal Display
    musicWidgetBtn.addEventListener('click', () => {
        musicModal.classList.toggle('active');
    });

    closePlayerBtn.addEventListener('click', () => {
        musicModal.classList.remove('active');
    });

    // Play/Pause Control
    playPauseBtn.addEventListener('click', togglePlay);

    function togglePlay() {
        if (isPlaying) {
            mainAudio.pause();
            playerVideo.pause();
            playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            miniCD.classList.remove('playing');
            playerCDView.classList.remove('playing');
        } else {
            mainAudio.play();
            playerVideo.play();
            playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            miniCD.classList.add('playing');
            playerCDView.classList.add('playing');
        }
        isPlaying = !isPlaying;
    }

    // View Switching Logic (Video Mode vs CD Spin Mode)
    videoModeBtn.addEventListener('click', () => {
        videoModeBtn.classList.add('active');
        cdModeBtn.classList.remove('active');

        playerVideo.style.display = 'block';
        playerCDView.style.display = 'none';
    });

    cdModeBtn.addEventListener('click', () => {
        cdModeBtn.classList.add('active');
        videoModeBtn.classList.remove('active');

        playerVideo.style.display = 'none';
        playerCDView.style.display = 'block';
    });
</script>
</body>
