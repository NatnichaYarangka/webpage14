<!-- FontAwesome Icons (จำเป็นสำหรับการแสดงไอคอนปุ่มต่างๆ) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- FLOATING OCEAN MUSIC PLAYER (มุมขวาล่าง) -->
<style>
    /* ปุ่ม Mini CD ลอยมุมขวาล่าง */
    .music-widget-btn {
        position: fixed;
        bottom: 25px;
        right: 25px;
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: rgba(10, 25, 47, 0.9);
        border: 2px solid #00f2fe;
        box-shadow: 0 8px 25px rgba(0, 242, 254, 0.5);
        backdrop-filter: blur(10px);
        z-index: 9999999 !important;
        cursor: pointer !important;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s ease;
    }

    .music-widget-btn:hover {
        transform: scale(1.1);
    }

    /* แผ่น CD หมุนขนาดเล็ก */
    .mini-cd-disc {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: repeating-radial-gradient(
            circle at center,
            #1e293b 0px,
            #0f172a 4px,
            #334155 8px,
            #0f172a 12px
        );
        border: 2px solid rgba(255, 255, 255, 0.4);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: spinCD 8s linear infinite;
        animation-play-state: paused;
    }

    .mini-cd-disc.playing {
        animation-play-state: running;
    }

    .mini-cd-center {
        width: 14px;
        height: 14px;
        background: #00f2fe;
        border-radius: 50%;
        border: 3px solid #0f172a;
        box-shadow: 0 0 8px #00f2fe;
    }

    /* หน้าต่าง Pop-up เครื่องเล่นเพลง */
    .music-player-modal {
        position: fixed;
        bottom: 100px;
        right: 25px;
        width: 310px;
        background: rgba(8, 20, 45, 0.95);
        border: 1px solid rgba(0, 242, 254, 0.5);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 242, 254, 0.3);
        backdrop-filter: blur(20px);
        z-index: 9999998 !important;
        display: none;
        flex-direction: column;
        gap: 15px;
        animation: popUp 0.3s ease;
    }

    .music-player-modal.active {
        display: flex;
    }

    @keyframes popUp {
        0% { opacity: 0; transform: translateY(20px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .player-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #fff;
    }

    .player-header h4 {
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #00f2fe;
        margin: 0;
    }

    .close-player-btn {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.7);
        font-size: 18px;
        cursor: pointer !important;
    }

    .close-player-btn:hover {
        color: #ff4757;
    }

    /* โซนแสดงผล วิดีโอ / แผ่นซีดีหมุน */
    .player-display-container {
        width: 100%;
        height: 180px;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        background: #020617;
        border: 1px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .player-video-view {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .player-cd-view {
        display: none;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at center, #334155 0%, #0f172a 70%);
        border: 4px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        position: relative;
        animation: spinCD 6s linear infinite;
        animation-play-state: paused;
    }

    .player-cd-view.playing {
        animation-play-state: running;
    }

    .player-cd-view::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 35px;
        height: 35px;
        background: #00f2fe;
        border-radius: 50%;
        border: 4px solid #020617;
    }

    @keyframes spinCD {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .song-info {
        text-align: center;
        color: #fff;
    }

    .song-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: #ffffff;
    }

    .song-artist {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
    }

    .player-controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .view-toggle-btns {
        display: flex;
        justify-content: center;
        gap: 8px;
    }

    .mode-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 5px 12px;
        border-radius: 12px;
        font-size: 0.75rem;
        cursor: pointer !important;
        transition: 0.3s;
    }

    .mode-btn.active {
        background: #00f2fe;
        color: #020617;
        font-weight: 600;
    }

    .action-btns {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }

    .control-btn {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 18px;
        cursor: pointer !important;
    }

    .control-btn.play-btn {
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, #00f2fe, #0088ff);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        box-shadow: 0 4px 12px rgba(0, 242, 254, 0.4);
    }
</style>

<!-- ปุ่ม Mini CD ลอยมุมขวาล่าง -->
<div class="music-widget-btn" id="musicWidgetBtn" title="เปิด/ปิด เครื่องเล่นเพลง">
    <div class="mini-cd-disc" id="miniCD">
        <div class="mini-cd-center"></div>
    </div>
</div>

<!-- Pop-up หน้าต่างเล่นเพลง -->
<div class="music-player-modal" id="musicModal">
    <div class="player-header">
        <h4><i class="fa-solid fa-compact-disc"></i> Ocean Music Player</h4>
        <button class="close-player-btn" id="closePlayerBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="player-display-container">
        <!-- 1. หน้าจอวิดีโอ -->
        <video class="player-video-view" id="playerVideo" loop playsinline muted>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-underwater-view-of-ocean-waves-40118-large.mp4" type="video/mp4">
        </video>

        <!-- 2. หน้าจอแผ่น CD หมุน -->
        <div class="player-cd-view" id="playerCDView"></div>
    </div>

    <div class="song-info">
        <div class="song-title">Something In The Water</div>
        <div class="song-artist">RIIZE</div>
    </div>

    <!-- ไฟล์เพลง MP3 ในเครื่องของคุณ -->
    <audio id="mainAudio" loop>
        <source src="Y2Mate.is - RIIZE Somethings in the Water Official Audio.mp3" type="audio/mpeg">
    </audio>

    <div class="player-controls">
        <div class="view-toggle-btns">
            <button class="mode-btn active" id="videoModeBtn"><i class="fa-solid fa-video"></i> วิดีโอ</button>
            <button class="mode-btn" id="cdModeBtn"><i class="fa-solid fa-compact-disc"></i> แผ่นซีดีหมุน</button>
        </div>

        <div class="action-btns">
            <button class="control-btn" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
            <button class="control-btn play-btn" id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
            <button class="control-btn" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>
</div>

<script>
    const musicWidgetBtn = document.getElementById('musicWidgetBtn');
    const musicModal = document.getElementById('musicModal');
    const closePlayerBtn = document.getElementById('closePlayerBtn');

    const mainAudio = document.getElementById('mainAudio');
    const playerVideo = document.getElementById('playerVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const miniCD = document.getElementById('miniCD');
    const playerCDView = document.getElementById('playerCDView');

    const videoModeBtn = document.getElementById('videoModeBtn');
    const cdModeBtn = document.getElementById('cdModeBtn');

    let isPlaying = false;

    // เปิด/ปิด หน้าต่างเล่นเพลง
    musicWidgetBtn.addEventListener('click', () => {
        musicModal.classList.toggle('active');
    });

    closePlayerBtn.addEventListener('click', () => {
        musicModal.classList.remove('active');
    });

    // ปุ่ม Play / Pause
    playPauseBtn.addEventListener('click', togglePlay);

    function togglePlay() {
        if (isPlaying) {
            mainAudio.pause();
            playerVideo.pause();
            playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            miniCD.classList.remove('playing');
            playerCDView.classList.remove('playing');
        } else {
            mainAudio.play().then(() => {
                playerVideo.play();
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                miniCD.classList.add('playing');
                playerCDView.classList.add('playing');
            }).catch(error => {
                console.log("Audio play failed:", error);
            });
        }
        isPlaying = !isPlaying;
    }

    // สลับโหมด วิดีโอ <-> แผ่น CD
    videoModeBtn.addEventListener('click', () => {
        videoModeBtn.classList.add('active');
        cdModeBtn.classList.remove('active');
        playerVideo.style.display = 'block';
        playerCDView.style.display = 'none';
    });

    cdModeBtn.addEventListener('click', () => {
        cdModeBtn.classList.add('active');
        videoModeBtn.classList.remove('active');
        playerVideo.style.display = 'none';
        playerCDView.style.display = 'block';
    });
</script>
